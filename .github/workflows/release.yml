# Releases: release-please opens (and keeps up to date) a "chore(main): release x.y.z" PR
# built from the Conventional Commits on main. Merging it tags the release; the second job
# then builds the binaries and attaches them to that GitHub release.
#
# One-time setting: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in x86_64-linux-musl aarch64-linux-musl; do
            zig build -Dtarget="$target" -Doptimize=small --prefix "out/$target"
            name="zpawn-${TAG}-${target}"
            mkdir -p "dist/$name"
            cp "out/$target/bin/zpawn" "dist/$name/"
            cp README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
