name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    # Every commit of a PR, and the PR title (it becomes the commit message on squash),
    # must follow Conventional Commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit-message.sh "$TITLE"
      - name: Check every commit of the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            msg=$(git log -1 --format=%B "$sha")
            if ! scripts/check-commit-message.sh "$msg" 2>/dev/null; then
              echo "::error::commit ${sha} is not a Conventional Commit: $(git log -1 --format=%s "$sha")"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || { scripts/check-commit-message.sh "bad"; exit 1; }

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh test/commit_messages.sh
      - run: sh test/run.sh
