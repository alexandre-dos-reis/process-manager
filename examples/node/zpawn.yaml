# Une vraie petite appli Node (sans dépendance, juste `node`) :
#   migrate : script ponctuel, ne redémarre pas une fois terminé
#   api attend migrate ; worker attend migrate et que l'API soit healthy (health + depends_on)
#   api     : serveur HTTP sur le port 3000 (PORT=4000 zpawn up pour changer)
#   worker  : consommateur de file, avec une variable d'environnement dédiée
#
#   zpawn up                    # tout défile, Ctrl-C arrête
#   curl localhost:3000/api/time
#   curl localhost:3000/api/boom   # une erreur 500 + stack en rouge dans les logs
processes:
  migrate:
    cmd: node migrate.js
    restart: false
  # api attend la fin (réussie) de migrate, et est "prête" quand /health répond
  # (`zpawn ls` montre starting puis healthy).
  api:
    cmd: node server.js
    depends_on: [migrate]
    health: "curl -fs http://127.0.0.1:${PORT:-3000}/health"
    env:
      NODE_ENV: development
  # le worker attend la fin de migrate ET que l'API réponde vraiment
  worker:
    cmd: node worker.js
    depends_on: [migrate, api]
    env:
      QUEUE: emails
